name: "Build and Test Native"
description: "Sets up Dart, installs platform deps, builds with CMake+ccache, and runs Dart tests"

runs:
  using: composite
  steps:
    - name: Setup Dart SDK
      uses: dart-lang/setup-dart@v1

    - name: Cache Dart packages
      uses: actions/cache@v6
      with:
        path: ~/.pub-cache
        key: dart-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.yaml') }}
        restore-keys: |
          dart-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build ccache libboost-dev libssl-dev

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        if brew tap | grep -qx 'aws/tap'; then
          brew untap aws/tap
        fi
        HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja ccache boost openssl@3

    - name: Install Windows dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $boostDir = Get-ChildItem 'C:\local' -Directory -ErrorAction SilentlyContinue |
          Where-Object { $_.Name -like 'boost_*' } |
          Select-Object -First 1
        if (-not $boostDir) {
          choco install -y boost-msvc-14.3 --no-progress --limit-output --execution-timeout=1200
        }
        if (-not (Get-Command ccache.exe -ErrorAction SilentlyContinue)) {
          choco install -y ccache --no-progress --limit-output
        }
        cmake --version
        ninja --version
        ccache --version

    - name: Set up MSVC developer environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}

    - name: ccache Storage (Linux)
      if: runner.os == 'Linux'
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: |
          ccache-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: ccache Storage (macOS)
      if: runner.os == 'macOS'
      uses: actions/cache@v6
      with:
        path: ~/Library/Caches/ccache
        key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: |
          ccache-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: ccache Storage (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v6
      with:
        path: ~\AppData\Local\ccache
        key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: |
          ccache-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Configure ccache
      shell: bash
      run: |
        ccache --set-config=max_size=1G
        ccache --set-config=compression=true
        ccache --zero-stats

    - name: Configure and build (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        VERSION="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
        case "$(uname -m)" in
          x86_64) PRESET="linux-x64"; ARCHITECTURE="x64"; ELF_MACHINE="Advanced Micro Devices X86-64" ;;
          aarch64|arm64) PRESET="linux-arm64"; ARCHITECTURE="arm64"; ELF_MACHINE="AArch64" ;;
          *) echo "Unsupported Linux architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        cmake --preset "$PRESET" -DLTD_BINARY_LAYOUT_VERSION="$VERSION"
        cmake --build --preset "$PRESET" --parallel

        BINARY="binaries/linux/$VERSION/$ARCHITECTURE/libtorrent-rasterbar.so"
        readelf -h "$BINARY" | grep -F "Machine:" | grep -F "$ELF_MACHINE"

    - name: Configure and build (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        VERSION="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
        BOOST_INC="$(brew --prefix boost)/include"
        OPENSSL_ROOT="$(brew --prefix openssl@3)"
        case "$(uname -m)" in
          arm64) PRESET="macos-arm64" ;;
          x86_64) PRESET="macos-x64" ;;
          *) echo "Unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        cmake --preset "$PRESET" \
          -DLTD_BOOST_HEADERS_ROOT="$BOOST_INC" \
          -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" \
          -DLTD_BINARY_LAYOUT_VERSION="$VERSION"
        cmake --build --preset "$PRESET" --parallel

        BINARY="binaries/macos/$VERSION/${PRESET#macos-}/libtorrent-rasterbar.dylib"
        EXPECTED_ARCHITECTURE="$(uname -m)"
        if [ "$(lipo -archs "$BINARY")" != "$EXPECTED_ARCHITECTURE" ]; then
          echo "$BINARY is not a thin $EXPECTED_ARCHITECTURE binary" >&2
          exit 1
        fi

    - name: Cache Windows OpenSSL static libs
      if: runner.os == 'Windows'
      id: windows_openssl_cache
      uses: actions/cache@v6
      with:
        path: thirdparty/openssl-windows
        key: openssl-windows-v1-${{ runner.arch }}-3.4.1-mt-${{ hashFiles('scripts/build_openssl_windows.ps1') }}

    - name: Build static OpenSSL for Windows
      if: runner.os == 'Windows' && steps.windows_openssl_cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $architecture = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
        .\scripts\build_openssl_windows.ps1 -Architecture $architecture

    - name: Configure and build (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $boostDir = Get-ChildItem 'C:\local' -Directory | Where-Object { $_.Name -like 'boost_*' } | Select-Object -First 1
        if (-not $boostDir) { throw 'Boost headers not found under C:\local' }
        $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
        $architecture = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
        $preset = "windows-$architecture"
        $OPENSSL_ROOT = "$(Get-Location)\thirdparty\openssl-windows\$architecture"
        cmake --preset $preset `
          -DLTD_BOOST_HEADERS_ROOT="$($boostDir.FullName)" `
          -DLTD_BINARY_LAYOUT_VERSION="$version" `
          -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" `
          -DOPENSSL_SSL_LIBRARY="$OPENSSL_ROOT\lib\libssl.lib" `
          -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_ROOT\lib\libcrypto.lib" `
          -DOPENSSL_INCLUDE_DIR="$OPENSSL_ROOT\include"
        cmake --build --preset $preset --parallel

        $binary = "binaries\windows\$version\$architecture\torrent-rasterbar.dll"
        $machine = if ($architecture -eq 'arm64') { 'ARM64' } else { 'x64' }
        $headers = dumpbin /headers $binary
        if (-not ($headers | Select-String -SimpleMatch "machine ($machine)")) {
          throw "$binary is not a $machine DLL"
        }

    - name: Show ccache statistics
      shell: bash
      run: ccache --show-stats

    - name: Pub get
      shell: bash
      run: dart pub get

    - name: Analyze
      shell: bash
      run: dart analyze

    - name: Test
      shell: bash
      run: dart test
