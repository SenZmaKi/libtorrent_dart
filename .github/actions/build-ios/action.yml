name: Build and verify iOS
description: Build the complete iOS archive and verify a native consumer link

runs:
  using: composite
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        if brew tap | grep -qx 'aws/tap'; then
          brew untap aws/tap
        fi
        HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake boost

    - name: Build complete iOS archive
      shell: bash
      run: |
        VERSION="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
        BOOST_INC="$(brew --prefix boost)/include"
        cmake --preset ios \
          -DLTD_BOOST_HEADERS_ROOT="$BOOST_INC" \
          -DLTD_BINARY_LAYOUT_VERSION="$VERSION"
        cmake --build --preset ios --parallel

    - name: Verify iOS archive contents and native link
      shell: bash
      run: |
        VERSION="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
        ARCHIVE="binaries/ios/$VERSION/libtorrent-rasterbar.a"
        MEMBER_COUNT="$(ar -t "$ARCHIVE" | wc -l | tr -d ' ')"
        ARCHIVE_SIZE="$(stat -f '%z' "$ARCHIVE")"
        if [ "$MEMBER_COUNT" -le 2 ] || [ "$ARCHIVE_SIZE" -le 1000000 ]; then
          echo "$ARCHIVE is not a complete libtorrent archive" >&2
          exit 1
        fi
        lipo "$ARCHIVE" -verify_arch arm64

        SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
        xcrun --sdk iphoneos clang++ \
          -arch arm64 \
          -miphoneos-version-min=13.0 \
          -isysroot "$SDK_PATH" \
          -Isrc/c \
          tool/ios_link_smoke.cpp \
          "$ARCHIVE" \
          -framework CoreFoundation \
          -framework Security \
          -framework SystemConfiguration \
          -o "$RUNNER_TEMP/libtorrent-ios-link-smoke"
