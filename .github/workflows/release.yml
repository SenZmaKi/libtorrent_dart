name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/build-native

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.architecture }}-binary
          path: binaries/linux/*/${{ matrix.architecture }}/libtorrent-rasterbar.so

  build-macos:
    strategy:
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/build-native

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.architecture }}-binary
          path: binaries/macos/*/${{ matrix.architecture }}/libtorrent-rasterbar.dylib

  build-windows:
    strategy:
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/build-native

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.architecture }}-binary
          path: binaries/windows/*/${{ matrix.architecture }}/torrent-rasterbar.dll

  build-android:
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            preset: android-arm64
          - abi: x86_64
            preset: android-x64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/build-android
        with:
          abi: ${{ matrix.abi }}
          preset: ${{ matrix.preset }}

      - name: Upload Android binary
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.abi }}-binary
          path: binaries/android/*/${{ matrix.abi }}/libtorrent-rasterbar.so

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install macOS dependencies
        run: |
          if brew tap | grep -qx 'aws/tap'; then
            brew untap aws/tap
          fi
          HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja boost openssl@3

      - name: Configure and build (iOS arm64)
        run: |
          VERSION="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          BOOST_INC="$(brew --prefix boost)/include"
          cmake --preset ios \
            -DLTD_BOOST_HEADERS_ROOT="$BOOST_INC" \
            -DLTD_BINARY_LAYOUT_VERSION="$VERSION"
          cmake --build --preset ios --parallel

      - name: Upload iOS binary
        uses: actions/upload-artifact@v7
        with:
          name: ios-binary
          path: binaries/ios/*/Release/libtorrent-rasterbar.a

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows, build-android, build-ios]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Prepare release asset names
        run: |
          LINUX_X64_LIB="$(find release-assets/linux-x64-binary -type f -name 'libtorrent-rasterbar.so' | head -n 1)"
          LINUX_ARM64_LIB="$(find release-assets/linux-arm64-binary -type f -name 'libtorrent-rasterbar.so' | head -n 1)"
          MACOS_ARM64_LIB="$(find release-assets/macos-arm64-binary -type f -name 'libtorrent-rasterbar.dylib' | head -n 1)"
          MACOS_X64_LIB="$(find release-assets/macos-x64-binary -type f -name 'libtorrent-rasterbar.dylib' | head -n 1)"
          WINDOWS_X64_LIB="$(find release-assets/windows-x64-binary -type f -name 'torrent-rasterbar.dll' | head -n 1)"
          WINDOWS_ARM64_LIB="$(find release-assets/windows-arm64-binary -type f -name 'torrent-rasterbar.dll' | head -n 1)"
          ANDROID_ARM64_LIB="$(find release-assets/android-arm64-v8a-binary -type f -name 'libtorrent-rasterbar.so' | head -n 1)"
          ANDROID_X64_LIB="$(find release-assets/android-x86_64-binary -type f -name 'libtorrent-rasterbar.so' | head -n 1)"
          IOS_LIB="$(find release-assets/ios-binary -type f -name '*.a' | head -n 1)"

          if [ -z "$LINUX_X64_LIB" ] || [ -z "$LINUX_ARM64_LIB" ] || [ -z "$MACOS_ARM64_LIB" ] || [ -z "$MACOS_X64_LIB" ] || [ -z "$WINDOWS_X64_LIB" ] || [ -z "$WINDOWS_ARM64_LIB" ] || [ -z "$ANDROID_ARM64_LIB" ] || [ -z "$ANDROID_X64_LIB" ] || [ -z "$IOS_LIB" ]; then
            echo "One or more release binaries were not found in downloaded artifacts" >&2
            exit 1
          fi

          cp "$LINUX_X64_LIB" release-assets/linux-x64-libtorrent-rasterbar.so
          cp "$LINUX_ARM64_LIB" release-assets/linux-arm64-libtorrent-rasterbar.so
          cp "$MACOS_ARM64_LIB" release-assets/macos-arm64-libtorrent-rasterbar.dylib
          cp "$MACOS_X64_LIB" release-assets/macos-x64-libtorrent-rasterbar.dylib
          cp "$WINDOWS_X64_LIB" release-assets/windows-x64-torrent-rasterbar.dll
          cp "$WINDOWS_ARM64_LIB" release-assets/windows-arm64-torrent-rasterbar.dll
          cp "$ANDROID_ARM64_LIB" release-assets/android-arm64-v8a-libtorrent-rasterbar.so
          cp "$ANDROID_X64_LIB" release-assets/android-x86_64-libtorrent-rasterbar.so
          cp "$IOS_LIB" release-assets/ios-libtorrent-rasterbar.a

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              release-assets/linux-x64-libtorrent-rasterbar.so \
              release-assets/linux-arm64-libtorrent-rasterbar.so \
              release-assets/macos-arm64-libtorrent-rasterbar.dylib \
              release-assets/macos-x64-libtorrent-rasterbar.dylib \
              release-assets/windows-x64-torrent-rasterbar.dll \
              release-assets/windows-arm64-torrent-rasterbar.dll \
              release-assets/android-arm64-v8a-libtorrent-rasterbar.so \
              release-assets/android-x86_64-libtorrent-rasterbar.so \
              release-assets/ios-libtorrent-rasterbar.a \
              --clobber
          else
            gh release create "$TAG_NAME" \
              release-assets/linux-x64-libtorrent-rasterbar.so \
              release-assets/linux-arm64-libtorrent-rasterbar.so \
              release-assets/macos-arm64-libtorrent-rasterbar.dylib \
              release-assets/macos-x64-libtorrent-rasterbar.dylib \
              release-assets/windows-x64-torrent-rasterbar.dll \
              release-assets/windows-arm64-torrent-rasterbar.dll \
              release-assets/android-arm64-v8a-libtorrent-rasterbar.so \
              release-assets/android-x86_64-libtorrent-rasterbar.so \
              release-assets/ios-libtorrent-rasterbar.a \
              --title "$TAG_NAME" \
              --target "${{ github.sha }}" \
              --generate-notes
          fi

  publish-pub:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish-release
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
